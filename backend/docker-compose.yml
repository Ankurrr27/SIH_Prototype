services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: legal_metrology_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: legal_metrology_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & BullMQ Queue Service
  redis:
    image: redis:7-alpine
    container_name: legal_metrology_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_metrology_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/legal_metrology_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "2d22890d2c87bdade7aaf2ad68fa25fbc442df73b1161adc8559c928ba6a2e9b4e69f7ed4340fd6e675bb4543c27c82186171d506e0a70d4db9349179658678e"
      JWT_REFRESH_SECRET: "675bf2ddda6de646f0fd24ac051be4424b4eee5f826dc9137c3f921d02de5d62d2812519f5e320797e4fe13f2597416502fa823cf60e1a809b2c559cae8fcb05"
      JWT_ACCESS_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      PUBLIC_VERIFICATION_BASE_URL: "http://localhost:5000/api/public/certificates/verify"
      UPLOAD_DIR: "./uploads"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
